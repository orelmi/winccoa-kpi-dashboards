<!-- WinCC OA KPI — Landing page
     Redirects to the Sources page (default entry point).
     In WinCC OA live mode: panel loads individual pages directly via $startPage parameter.
     In browser simulation mode: this page redirects to sources.html. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/style.css">

  <header class="app-header" id="appHeader"></header>
  <nav class="tab-nav" id="appNav"></nav>

  <main class="tab-content">
    <div style="text-align:center;padding:60px 24px;color:#6b7c8e;">
      <h2 style="margin-bottom:12px;">Loading KPI Configuration...</h2>
      <p>Redirecting to the default page.</p>
    </div>
  </main>

  <script src="js/kpi.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script>
    (function() {
      KPI.init();
      Nav.render('sources');
      // Redirect to sources page
      KPI.navigate('sources');
    })();
  </script>
